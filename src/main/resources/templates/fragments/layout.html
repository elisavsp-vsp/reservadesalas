<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Reserva de Salas'">Reserva de Salas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- Barra de navegacao (RNF001): menus claros e padrao visual unico -->
<nav th:fragment="navbar" class="navbar navbar-expand-md navbar-dark bg-ufscar mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">📚 Salas de Estudo</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Alternar menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal" th:if="${session.usuarioLogado != null}">
            <ul class="navbar-nav me-auto">
                <th:block th:if="${!session.usuarioLogado.administrador}">
                    <li class="nav-item"><a class="nav-link" th:href="@{/salas}">Salas</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/minhas-reservas}">Minhas reservas</a></li>
                </th:block>
                <th:block th:if="${session.usuarioLogado.administrador}">
                    <li class="nav-item"><a class="nav-link" th:href="@{/admin/salas}">Gerenciar salas</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/admin/reservas}">Todas as reservas</a></li>
                </th:block>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex align-items-center gap-3">
                <span class="navbar-text small">
                    <span th:text="${session.usuarioLogado.nome}">Nome</span>
                    <span class="badge text-bg-light ms-1"
                          th:text="${session.usuarioLogado.administrador} ? 'Administrador' : 'Aluno'">Aluno</span>
                </span>
                <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
            </form>
        </div>
    </div>
</nav>

<!-- Mensagens de sucesso/erro (RNF002) -->
<div th:fragment="mensagens">
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${sucesso}">Operação realizada com sucesso.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${erro}">Erro.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
