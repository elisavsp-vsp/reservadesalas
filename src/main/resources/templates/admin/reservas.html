<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Todas as reservas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <h1 class="h3 mb-3">Todas as reservas</h1>

    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <div th:if="${#lists.isEmpty(reservas)}" class="alert alert-secondary">Nenhuma reserva registrada.</div>

    <div class="card" th:if="${!#lists.isEmpty(reservas)}">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Aluno</th>
                    <th>RA</th>
                    <th>Sala</th>
                    <th>Data</th>
                    <th>Horário</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${reservas}">
                    <td th:text="${r.aluno.nome}">Nome</td>
                    <td th:text="${r.aluno.ra}">000000</td>
                    <td th:text="${r.sala.identificacao}">Sala 01</td>
                    <td th:text="${#temporals.format(r.data, 'dd/MM/yyyy')}">25/09/2026</td>
                    <td>
                        <span th:text="${#temporals.format(r.horaInicio, 'HH:mm')}">15:00</span> –
                        <span th:text="${#temporals.format(r.horaFim, 'HH:mm')}">16:00</span>
                    </td>
                    <td class="text-end">
                        <form th:action="@{/admin/reservas/{id}/cancelar(id=${r.id})}" method="post"
                              onsubmit="return confirm('Cancelar esta reserva?');">
                            <button type="submit" class="btn btn-outline-danger btn-sm">Cancelar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
