<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="card auth-card">
        <div class="card-body p-4">
            <h1 class="h4 mb-1">Entrar</h1>
            <p class="text-muted small">Acesse com seu RA e senha.</p>

            <div th:replace="~{fragments/layout :: mensagens}"></div>
            <div th:if="${param.logout}" class="alert alert-info">Você saiu do sistema.</div>

            <form th:action="@{/login}" method="post" novalidate>
                <div class="mb-3">
                    <label for="ra" class="form-label">RA</label>
                    <input type="text" class="form-control" id="ra" name="ra" th:value="${raInformado}"
                           required autofocus autocomplete="username">
                </div>
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" name="senha"
                           required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>

            <hr>
            <p class="small mb-0 text-center">Ainda não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a></p>
        </div>
    </div>
    <p class="text-center text-muted small">
        Demonstração — aluno: RA <code>824695</code> / senha <code>123456</code> ·
        administrador: RA <code>admin</code> / senha <code>admin123</code>
    </p>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
