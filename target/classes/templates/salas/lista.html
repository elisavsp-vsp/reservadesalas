<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Salas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <h1 class="h3 mb-1">Salas de estudo</h1>
    <p class="text-muted">Escolha uma sala para consultar os horários e reservar.</p>

    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <div th:if="${#lists.isEmpty(salas)}" class="alert alert-secondary">Nenhuma sala cadastrada.</div>

    <div class="row g-3">
        <div class="col-12 col-md-6 col-lg-4" th:each="sala : ${salas}">
            <div class="card h-100">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start">
                        <h2 class="h5 mb-1" th:text="${sala.identificacao}">Sala 01</h2>
                        <span class="badge"
                              th:classappend="${sala.situacao.name() == 'DISPONIVEL'} ? 'text-bg-success' : 'text-bg-warning'"
                              th:text="${sala.situacao.descricao}">Disponível</span>
                    </div>
                    <p class="mb-1 text-muted" th:text="${sala.localizacao}">Localização</p>
                    <p class="mb-3">👥 Capacidade: <strong th:text="${sala.capacidade}">4</strong> pessoas</p>
                    <a class="btn btn-primary mt-auto" th:href="@{/salas/{id}(id=${sala.id})}">Ver horários</a>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
