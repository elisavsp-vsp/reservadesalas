<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastro')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="card auth-card">
        <div class="card-body p-4">
            <h1 class="h4 mb-1">Cadastro de aluno</h1>
            <p class="text-muted small">Preencha todos os campos para criar sua conta.</p>

            <form th:action="@{/cadastro}" th:object="${cadastroForm}" method="post" novalidate>
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome completo</label>
                    <input type="text" class="form-control" id="nome" th:field="*{nome}"
                           th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{nome}"></div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <div class="mb-3">
                    <label for="ra" class="form-label">RA</label>
                    <input type="text" class="form-control" id="ra" th:field="*{ra}"
                           th:classappend="${#fields.hasErrors('ra')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{ra}"></div>
                </div>
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" th:field="*{senha}"
                           th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{senha}"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
            </form>

            <hr>
            <p class="small mb-0 text-center">Já tem conta? <a th:href="@{/login}">Entrar</a></p>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
